<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img" aria-label="AeroGate versus greedy rules on the Pearson evening: tarmac holds and score">
<title>AeroGate versus greedy rules on the Pearson evening: tarmac holds and score</title>
<rect x="0.5" y="0.5" width="879" height="213" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">Same evening, same disruptions</text><text x="24" y="50" font-size="12.5" fill="#52514e">Both plans gate all 83 flights with no rule violations. The difference is the tarmac.</text><rect x="24" y="67" width="14" height="3" rx="1.5" fill="#2a78d6"/><text x="44" y="72" font-size="12.5" fill="#52514e">AeroGate</text><rect x="116" y="67" width="14" height="3" rx="1.5" fill="#eb6834"/><text x="136" y="72" font-size="12.5" fill="#52514e">Greedy rules</text><text x="24" y="92" font-size="12" fill="#52514e">Flights held on the tarmac</text><line x1="24" x2="24" y1="102" y2="158" stroke="#c3c2b7" stroke-width="1"/><path d="M25,108h37.5a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-37.5Z" fill="#2a78d6"/><text x="72.45454545454545" y="120.5" font-size="12.5" font-weight="600" fill="#0b0b0b">3</text><path d="M25,136h148.0a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-148.0Z" fill="#eb6834"/><text x="183" y="148.5" font-size="12.5" font-weight="600" fill="#0b0b0b">11</text><text x="240" y="92" font-size="12" fill="#52514e">Minutes held on the tarmac</text><line x1="240" x2="240" y1="102" y2="158" stroke="#c3c2b7" stroke-width="1"/><path d="M241,108h29.3a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-29.3Z" fill="#2a78d6"/><text x="280.25" y="120.5" font-size="12.5" font-weight="600" fill="#0b0b0b">70</text><path d="M241,136h148.0a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-148.0Z" fill="#eb6834"/><text x="399" y="148.5" font-size="12.5" font-weight="600" fill="#0b0b0b">320</text><text x="456" y="92" font-size="12" fill="#52514e">Passenger-hours held</text><line x1="456" x2="456" y1="102" y2="158" stroke="#c3c2b7" stroke-width="1"/><path d="M457,108h22.9a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-22.9Z" fill="#2a78d6"/><text x="489.94545454545454" y="120.5" font-size="12.5" font-weight="600" fill="#0b0b0b">234</text><path d="M457,136h148.0a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-148.0Z" fill="#eb6834"/><text x="615" y="148.5" font-size="12.5" font-weight="600" fill="#0b0b0b">1,320</text><text x="672" y="92" font-size="12" fill="#52514e">Score (lower is better)</text><line x1="672" x2="672" y1="102" y2="158" stroke="#c3c2b7" stroke-width="1"/><path d="M673,108h117.1a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-117.1Z" fill="#2a78d6"/><text x="800.1495104525006" y="120.5" font-size="12.5" font-weight="600" fill="#0b0b0b">301.2</text><path d="M673,136h148.0a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-148.0Z" fill="#eb6834"/><text x="831" y="148.5" font-size="12.5" font-weight="600" fill="#0b0b0b">377.9</text><text x="24" y="196" font-size="11.5" fill="#898781">Pearson evening bank: 83 flights, thunderstorm, jetbridge failure, medical diversion, 787 swap, cancellation. Passenger-hours at an 85% load factor.</text></g>
</svg>
